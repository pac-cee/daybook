name: kigali_weather
description: Weather across Rwanda and a personal task notebook, with offline SQLite storage.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+2
flutter:
  uses-material-design: true
hooks:
  user_defines:
    sqlite3:
      source: system
